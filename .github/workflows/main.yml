name: Build Anita AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project ZIP exists
        run: test -f anita-ai-starter.zip

      - name: Extract Anita AI project
        run: |
          unzip -q anita-ai-starter.zip -d anita-project
          cp -R anita-project/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anita-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
